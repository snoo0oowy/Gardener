<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gardener</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Left Panel -->
    <aside id="left-panel">
      <!-- Layers column -->
      <div id="left-col-layers">
        <div class="panel-section" id="layers-section">
          <h3>Layers</h3>
          <div id="layer-tree"></div>
        </div>
      </div>
      <!-- Elements column -->
      <div id="left-col-elements">
        <div class="panel-section">
          <h3>Canvas</h3>
          <select id="canvas-preset">
            <option value="iphone17" selected>iPhone 17 (393×852)</option>
            <option value="desktop">Desktop (1440×900)</option>
            <option value="custom">Custom</option>
          </select>
          <div id="custom-size" class="hidden">
            <input type="number" id="custom-w" placeholder="Width" value="390">
            <span>×</span>
            <input type="number" id="custom-h" placeholder="Height" value="844">
            <button id="apply-custom">Apply</button>
          </div>
        </div>
        <div class="panel-section">
          <h3>Elements</h3>
          <div id="element-palette">
            <div class="palette-item" data-type="view">
              <div class="palette-icon">&#9633;</div>
              <span>View</span>
            </div>
            <div class="palette-item" data-type="image">
              <div class="palette-icon">&#128247;</div>
              <span>Image</span>
            </div>
            <div class="palette-item" data-type="text">
              <div class="palette-icon">T</div>
              <span>Text</span>
            </div>
            <div class="palette-item" data-type="button">
              <div class="palette-icon">&#9654;</div>
              <span>Button</span>
            </div>
            <div class="palette-item" data-type="input">
              <div class="palette-icon">&#9998;</div>
              <span>Input</span>
            </div>
            <div class="palette-item" data-type="scrollview">
              <div class="palette-icon">&#8597;</div>
              <span>ScrollView</span>
            </div>
            <div class="palette-item" data-type="slider">
              <div class="palette-icon">&#8212;</div>
              <span>Slider</span>
            </div>
            <div class="palette-item" data-type="icon">
              <div class="palette-icon">&#9678;</div>
              <span>Icon</span>
            </div>
            <div class="palette-item" data-type="switch">
              <div class="palette-icon">&#9681;</div>
              <span>Switch</span>
            </div>
          </div>
        </div>
        <div class="panel-section">
          <h3>Actions</h3>
          <button id="btn-export">Export</button>
        </div>
      </div>
    </aside>

    <!-- Canvas Area -->
    <main id="canvas-area">
      <div id="canvas-wrapper">
        <div id="canvas">
          <div id="snap-guide-h" class="snap-guide horizontal"></div>
          <div id="snap-guide-v" class="snap-guide vertical"></div>
        </div>
        <div id="handles-overlay"></div>
        <div id="device-chrome"></div>
      </div>
    </main>

    <!-- Right Panel -->
    <aside id="right-panel">
      <div id="props-empty">
        <p>Select an element to edit its properties</p>
      </div>
      <div id="props-content" class="hidden">
        <h3 id="props-title">Properties</h3>
        <div class="prop-group">
          <label>Name</label>
          <div class="prop-row full">
            <div class="prop-field full">
              <input type="text" id="prop-name" placeholder="Component name">
            </div>
          </div>
        </div>
        <div class="prop-group">
          <label>Position & Size</label>
          <div class="prop-row">
            <div class="prop-field">
              <label>X</label>
              <input type="number" id="prop-x">
            </div>
            <div class="prop-field">
              <label>Y</label>
              <input type="number" id="prop-y">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>W</label>
              <input type="number" id="prop-w">
            </div>
            <div class="prop-field">
              <label>H</label>
              <input type="number" id="prop-h">
            </div>
          </div>
        </div>
        <div class="prop-group">
          <label>Style</label>
          <div class="prop-row">
            <div class="prop-field">
              <label>BG</label>
              <input type="color" id="prop-bg">
            </div>
            <div class="prop-field">
              <label>Radius</label>
              <input type="number" id="prop-radius" min="0">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field full">
              <label class="prop-checkbox-label">
                <input type="checkbox" id="prop-bg-transparent"> Transparent background
              </label>
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>Opacity</label>
              <input type="number" id="prop-opacity" min="0" max="1" step="0.1">
            </div>
          </div>
        </div>
        <div class="prop-group" id="text-props">
          <label>Text</label>
          <div class="prop-row full">
            <div class="prop-field full">
              <label>Content</label>
              <input type="text" id="prop-text">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>Font Size</label>
              <input type="number" id="prop-font-size" min="1">
            </div>
            <div class="prop-field">
              <label>Weight</label>
              <select id="prop-font-weight">
                <option value="normal">Normal</option>
                <option value="bold">Bold</option>
              </select>
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>Color</label>
              <input type="color" id="prop-color">
            </div>
            <div class="prop-field">
              <label>Align</label>
              <select id="prop-text-align">
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </div>
          </div>
        </div>
        <div class="prop-group" id="image-props">
          <label>Image</label>
          <div class="prop-row full">
            <div class="prop-field full">
              <label>Source</label>
              <input type="text" id="prop-src" placeholder="image URL or path">
            </div>
          </div>
        </div>
        <div class="prop-group" id="scrollview-props">
          <label>ScrollView</label>
          <div class="prop-row">
            <div class="prop-field">
              <label>Direction</label>
              <select id="prop-scroll-direction">
                <option value="vertical">↕ Vertical</option>
                <option value="horizontal">↔ Horizontal</option>
                <option value="all">⊕ All</option>
              </select>
            </div>
          </div>
        </div>
        <div class="prop-group hidden" id="slider-props">
          <label>Slider</label>
          <div class="prop-row">
            <div class="prop-field">
              <label>Min</label>
              <input type="number" id="prop-slider-min">
            </div>
            <div class="prop-field">
              <label>Max</label>
              <input type="number" id="prop-slider-max">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>Value</label>
              <input type="number" id="prop-slider-value">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>Fill</label>
              <input type="color" id="prop-slider-fill">
            </div>
            <div class="prop-field">
              <label>Thumb</label>
              <input type="color" id="prop-slider-thumb">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>Track</label>
              <input type="color" id="prop-slider-track">
            </div>
          </div>
        </div>
        <div class="prop-group hidden" id="switch-props">
          <label>Switch</label>
          <div class="prop-row">
            <div class="prop-field full">
              <label class="prop-checkbox-label">
                <input type="checkbox" id="prop-switch-checked"> On
              </label>
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>On Color</label>
              <input type="color" id="prop-switch-on-color">
            </div>
            <div class="prop-field">
              <label>Off Color</label>
              <input type="color" id="prop-switch-off-color">
            </div>
          </div>
        </div>
        <div class="prop-group hidden" id="icon-props">
          <label>Icon</label>
          <div class="prop-row full">
            <div class="prop-field full">
              <label>Name</label>
              <input type="text" id="prop-icon-name" placeholder="e.g. star.fill">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-field">
              <label>Color</label>
              <input type="color" id="prop-icon-color">
            </div>
          </div>
        </div>
        <div class="prop-group">
          <button id="btn-delete" class="danger">Delete Element</button>
        </div>
      </div>
    </aside>
  </div>
  <!-- Export preview modal -->
  <div id="export-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Export Preview</h3>
        <button id="modal-close">&times;</button>
      </div>
      <pre id="export-preview"></pre>
      <div class="modal-footer">
        <button id="btn-copy-export">Copy to Clipboard</button>
      </div>
    </div>
  </div>
  <script src="js/devices.js"></script>
  <script src="js/state.js"></script>
  <script src="js/history.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/snap.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/select.js"></script>
  <script src="js/export.js"></script>
  <script src="js/slider.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
